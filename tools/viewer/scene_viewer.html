<!doctype html><html lang="ru"><meta charset="utf-8"><title>REBGE — сцена Jade</title>
<style>body{margin:0;background:#14191f;color:#e4e8ed;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}aside{position:absolute;top:16px;left:16px;background:#151c24e8;padding:14px;border-radius:10px;max-width:390px}button{background:#354556;color:white;border:0;padding:7px 10px;border-radius:5px;cursor:pointer;margin:5px 5px 0 0}small{display:block;color:#afbac6;margin-top:8px}#status{margin:8px 0}</style>
<canvas id="view"></canvas><aside><b>Jade · 00_01_home_sas_hangar</b><div id="status">Загрузка…</div><button id="home">Внутри ангара</button><button id="outside">Снаружи</button><button id="texture">Текстуры: вкл.</button><small>Мышь: вращение · колесо: расстояние<br>Статическая реконструкция. Освещение упрощено.</small></aside>
<script>
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),gl=canvas.getContext('webgl');
if(!gl)throw Error('WebGL недоступен');
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 pos;attribute vec2 uv;uniform mat4 vp;varying vec2 tex;void main(){gl_Position=vp*vec4(pos,1.);tex=uv;}`));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec2 tex;uniform sampler2D image;uniform bool textured;void main(){vec4 c=textured?texture2D(image,tex):vec4(.56,.66,.72,1.);if(c.a<.2)discard;gl_FragColor=vec4(c.rgb,c.a);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const P=gl.getAttribLocation(program,'pos'),U=gl.getAttribLocation(program,'uv'),VP=gl.getUniformLocation(program,'vp'),T=gl.getUniformLocation(program,'textured');gl.enableVertexAttribArray(P);gl.enableVertexAttribArray(U);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
const sub=(a,b)=>a.map((x,i)=>x-b[i]),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),norm=a=>{let n=Math.hypot(...a);return a.map(x=>x/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function look(eye,target){let z=norm(sub(eye,target)),x=norm(cross([0,0,1],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]}
function perspective(aspect){let q=1/Math.tan(Math.PI/6),n=.05,f=3000;return [q/aspect,0,0,0,0,q,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]}
function mul(a,b){let r=Array(16).fill(0);for(let c=0;c<4;c++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)r[c*4+i]+=a[k*4+i]*b[c*4+k];return r}
let target=[95,5,4],distance=15,yaw=.8,pitch=.25,texturesOn=true,batches=[],loaded=0;
document.querySelector('#home').onclick=()=>{target=[95,5,4];distance=15;yaw=.8;pitch=.25};document.querySelector('#outside').onclick=()=>{target=[95,0,4];distance=65;yaw=-1;pitch=.45};document.querySelector('#texture').onclick=e=>{texturesOn=!texturesOn;e.target.textContent='Текстуры: '+(texturesOn?'вкл.':'выкл.')};
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw-=(e.clientX-drag[0])*.006;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]}};canvas.onwheel=e=>{e.preventDefault();distance=Math.max(.5,Math.min(1000,distance*Math.exp(e.deltaY*.001))) };
const cache=new Map();function loadTexture(url){if(cache.has(url))return cache.get(url);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([180,185,190,255]));const im=new Image;im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);loaded++};im.src='/assets/'+url;cache.set(url,t);return t}
fetch('/assets/scene.json').then(r=>{if(!r.ok)throw Error('scene.json '+r.status);return r.json()}).then(scene=>{for(const b of scene.batches){const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(b.vertices),gl.STATIC_DRAW);batches.push({buffer,count:b.vertices.length/5,texture:b.texture?loadTexture(b.texture):null})}window.sceneStats={objects:scene.objects,batches:batches.length,triangles:batches.reduce((n,b)=>n+b.count/3,0)};window.setCamera=(t,d,y,p)=>{target=t;distance=d;yaw=y;pitch=p};}).catch(e=>status.textContent=e.message);
function frame(){let w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.07,.1,.14,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let eye=[target[0]+distance*Math.cos(pitch)*Math.cos(yaw),target[1]+distance*Math.cos(pitch)*Math.sin(yaw),target[2]+distance*Math.sin(pitch)];gl.uniformMatrix4fv(VP,false,new Float32Array(mul(perspective(w/h),look(eye,target))));for(const b of batches){gl.bindBuffer(gl.ARRAY_BUFFER,b.buffer);gl.vertexAttribPointer(P,3,gl.FLOAT,false,20,0);gl.vertexAttribPointer(U,2,gl.FLOAT,false,20,12);gl.uniform1i(T,!!(texturesOn&&b.texture));if(b.texture)gl.bindTexture(gl.TEXTURE_2D,b.texture);gl.drawArrays(gl.TRIANGLES,0,b.count)}if(batches.length)status.textContent=`${batches.length} групп · ${loaded}/${cache.size} текстур`;requestAnimationFrame(frame)}frame();
</script></html>
